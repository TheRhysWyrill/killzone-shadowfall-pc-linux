# Killzone Shadow Fall Linux AppImage: built on Ubuntu 24.04 so it starts on glibc 2.39 or newer
# (SteamOS, Bazzite/Fedora, Debian 13, Ubuntu 24.04+), then opened on those distros before it is
# published. Run by hand (Actions > Killzone Shadow Fall Linux AppImage > Run workflow), or on a tag:
#   - no tag: build and test only (the AppImage is kept as a workflow artifact).
#   - tag of an existing release: the AppImage replaces the one attached to it.
#   - new tag (e.g. linux-v0.8.1-test1): test build, published as a pre-release on that commit.
name: Killzone Shadow Fall Linux AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the AppImage to; a new tag makes a test pre-release. Empty builds only.
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: kzsf-linux-appimage-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: bash packaging/linux/ci-deps.sh
      - name: Build runtime and GPU library
        run: bash build.sh
      - name: Build AppImage
        run: |
          PATH="$PWD/out/venv/bin:$PATH" bash packaging/linux/build-kzsf.sh
          cd dist
          sha256sum KillzoneShadowFall-v*-x86_64.AppImage | sed 's/  / */' > KillzoneShadowFall-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: KillzoneShadowFall-x86_64.AppImage
          path: |
            dist/KillzoneShadowFall-v*-x86_64.AppImage
            dist/KillzoneShadowFall-v*-x86_64.AppImage.sha256
            dist/KillzoneShadowFall-x86_64.AppImage.sha256
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # debian:13 has SteamOS 3.7's glibc (2.41), fedora:42 is Bazzite's base.
        image: ['debian:13', 'fedora:42', 'ubuntu:24.04', 'archlinux:latest',
                'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KillzoneShadowFall-x86_64.AppImage
          path: dist
      - name: Open the launcher on ${{ matrix.image }}
        run: |
          appimage=$(ls dist/KillzoneShadowFall-v*-x86_64.AppImage)
          chmod +x "$appimage"
          docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" \
            bash /w/packaging/linux/smoke-test-kzsf.sh "/w/$appimage"

  publish:
    needs: smoke
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KillzoneShadowFall-x86_64.AppImage
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Linux test build $TAG" \
              --notes "Linux test build from \`${GITHUB_SHA::7}\`. Download \`KillzoneShadowFall-v*-x86_64.AppImage\`, then \`chmod +x\` and run it. Not a final release: please report in the linked issue whether the launcher opens and the game runs."
          fi
          gh release upload "$TAG" dist/KillzoneShadowFall-v*-x86_64.AppImage \
            dist/KillzoneShadowFall-v*-x86_64.AppImage.sha256 \
            dist/KillzoneShadowFall-x86_64.AppImage.sha256 --clobber
